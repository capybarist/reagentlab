# Producción en el servidor Hetzner (ADR-0013). Desde la raíz del repo:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# La API no se publica a internet: el Caddy compartido de la máquina (/opt/edge, repo
# capybara-infra) la alcanza por la red Docker `edge` como `reagentlab-api:3000` y pone TLS delante.
# El puerto en 127.0.0.1 queda para comprobaciones desde el propio servidor.
name: reagentlab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reagentlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: reagentlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reagentlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # En el servidor no se construye: CI publica la imagen en GHCR y deploy-app la baja.
    # Rollback: IMAGE_TAG=sha-<corto> en deploy/.env.prod.
    image: ghcr.io/capybarist/reagentlab-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reagentlab:${POSTGRES_PASSWORD}@postgres:5432/reagentlab
      TOKEN_PEPPER: ${TOKEN_PEPPER:?define TOKEN_PEPPER}
      SIGNING_KEY: ${SIGNING_KEY:?define SIGNING_KEY}
      WEB_SERVICE_KEY: ${WEB_SERVICE_KEY:?define WEB_SERVICE_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://reagentlab.capybaralabs.tech,https://www.capybaralabs.tech,https://capybaralabs.tech}
      # Handles de GitHub que aprueban problemas propuestos (ADR-0020).
      ADMIN_HANDLES: ${ADMIN_HANDLES:-}
      # Login con email (ADR-0022): sin SMTP_USER/SMTP_PASS ese login queda desactivado.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:${API_PORT:-3010}:3000"
    networks:
      default:
      edge:
        aliases:
          - reagentlab-api

volumes:
  pgdata:

networks:
  # La red del Caddy compartido de la máquina (`docker network create edge`, una vez).
  edge:
    external: true
    name: ${CADDY_NETWORK:-edge}
